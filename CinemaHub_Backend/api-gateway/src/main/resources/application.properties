spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://host.docker.internal:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route to Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://auth-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# Route to Movie Service
spring.cloud.gateway.routes[1].id=movie-service
spring.cloud.gateway.routes[1].uri=http://movie-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/movies/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# Route to Booking Service
spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=http://booking-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/bookings/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# Route to Payment Service
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://payment-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=0

# WebSocket → Notification Service (same path on downstream)
spring.cloud.gateway.routes[4].id=notification-service-ws
spring.cloud.gateway.routes[4].uri=http://notification-service:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/ws/notifications/**

# REST → Notification Service (history from MySQL)
spring.cloud.gateway.routes[5].id=notification-service-api
spring.cloud.gateway.routes[5].uri=http://notification-service:8085
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notifications/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=0
